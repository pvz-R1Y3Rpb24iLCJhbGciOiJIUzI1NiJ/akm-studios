<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AKM Studios</title>
<meta name="description" content="AKM Studios — AI Cinema &amp; Music Video Production. Кадры, которые невозможно снять на камеру: музыкальные клипы и визуал для артистов.">
<meta name="theme-color" content="#0E0E0F">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AKM Studios">
<meta property="og:title" content="AKM Studios — AI Cinema &amp; Music Video Production">
<meta property="og:description" content="Кадры, которые невозможно снять на камеру.">
<meta property="og:image" content="https://pvz-r1y3rpb24ilcjhbgcioijiuzi1nij.github.io/akm-studios/media/og.jpg">
<meta property="og:url" content="https://pvz-r1y3rpb24ilcjhbgcioijiuzi1nij.github.io/akm-studios/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23F07A4A'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;400&family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="media/poster_card.jpg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="card">
  <video class="bg" autoplay muted loop playsinline preload="auto" poster="media/poster_card.jpg"
    data-src-desktop="media/card.mp4" data-src-mobile="media/card_720.mp4" aria-hidden="true"></video>
  <div class="shade" aria-hidden="true"></div>

  <header class="top in" style="--d:.1s">
    <img class="logo" src="media/AKM_site.svg" alt="AKM Studios" width="196" height="22">
    <span class="tagline">AI Cinema &amp; Music Video Production</span>
  </header>

  <section class="main">
    <h1 class="title">
      <span class="in" style="--d:.3s">Кадры, которые</span>
      <span class="in" style="--d:.45s">невозможно снять</span>
      <span class="in accent" style="--d:.6s">на камеру</span>
    </h1>
    <p class="lead in" style="--d:.85s">Музыкальные клипы и визуал для артистов. Постановка, свет и масштаб большого кино.</p>
  </section>

  <footer class="bottom">
    <ul class="services in" style="--d:1.05s" aria-label="Что мы делаем">
      <li>Клипы</li><li>Лирик-видео</li><li>Обложки</li><li>Тизеры</li><li>Титры</li>
    </ul>
    <nav class="contacts in" style="--d:1.2s" aria-label="Связаться">
      <!-- ссылки задаются в js/main.js, блок AKM_CONFIG -->
      <a class="btn btn-primary" href="https://www.instagram.com/akm__studios/" data-contact="instagram">Instagram</a>
      <a class="btn" href="#" data-contact="telegram">Telegram</a>
      <a class="btn" href="#" data-contact="vk">ВКонтакте</a>
      <a class="btn" href="#" data-contact="mail">Почта</a>
    </nav>
    <p class="copy in" style="--d:1.3s">© 2026 AKM Studios</p>
  </footer>
</main>

<script src="js/main.js"></script>
</body>
</html>
